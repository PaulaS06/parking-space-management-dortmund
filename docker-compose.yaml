services:
  # 1. The Database (Use a stock image, no Dockerfile needed usually)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 2. The Backend (Your API)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/app_db

  # 3. The Frontend (UI)
  frontend:
      build: ./frontend
      ports:
        - "3000:3000"
      environment:
        # This allows you to change the target without rewriting code
        - BACKEND_URL=http://backend:8000

volumes:
  db_data: