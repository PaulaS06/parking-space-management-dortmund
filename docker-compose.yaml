services:
  # 1. The Database (SQLite volume container)
  db:
    image: alpine:latest
    command: tail -f /dev/null
    volumes:
      - db_data:/data

  # 2. The Backend (API)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data
    depends_on:
      - db
    environment:
      DATABASE_URL: sqlite:///data/app.db
      # DEBUG: "true"  # Uncomment to enable debug mode (NOT recommended for production)

  # 3. The Frontend (UI)
  frontend:
      build: ./frontend
      ports:
        - "3000:3000"
      environment:
        - BACKEND_URL=http://backend:8000

volumes:
  db_data: