services:
  # 1. Database Microservice
  database:
    container_name: database
    build: ./features/database
    ports:
      - "5001:5001"
    volumes:
      - database_data:/app/database
    environment:
      DEBUG: "false"
      BASIC_AUTH_USERNAME: admin
      BASIC_AUTH_PASSWORD: lYbqZkYhlC2IJin7HcX5
    networks:
      - tunneling

  # 2. The Backend (API)
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DATABASE_SERVICE_URL: http://database:5001
      BASIC_AUTH_USERNAME: admin
      BASIC_AUTH_PASSWORD: lYbqZkYhlC2IJin7HcX5
      API_KEY: ${API_KEY}
      GEOAPIFY_ROUTING_KEY: ${GEOAPIFY_ROUTING_KEY}
      DEBUG: "true"  # Uncomment to enable debug mode (NOT recommended for production)
    networks:
      - tunneling

  # 3. The Frontend (UI)
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
        BACKEND_URL: http://backend:8000
        GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY}
        API_KEY: ${API_KEY}
    networks:
      - tunneling

  tunnel:
    container_name: tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://frontend:3000
    networks:
      - tunneling

networks:
  tunneling:
    driver: bridge

volumes:
  database_data:
