{% extends "layout.html" %}

{% block extra_js %}
<script src="/static/js/results_nearby_list.js" defer></script>
<script src="/static/js/nearby_location.js" defer></script>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="static/css/nearby.css">
{% endblock %}

{% block content %}
    <div id="errorBox" class="alert alert-danger d-none"></div>
    <div class="header">
        <img src="static/images/logo.png" alt="logo" class="header-img">
        <h1>ParkEasy</h1>
        <div class="user-icon-circle">
            <i class="fas fa-user"></i>
        </div>        
    </div>

        
    <div class="location-display">
        <span id="currentLocation">Detecting location...</span>
    </div>

    <ul id="parkingList" class="result-list"></ul>

{% endblock %}
