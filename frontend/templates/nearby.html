{% extends "layout.html" %}

{% block extra_js %}
<script src="static/js/nearby_location.js" defer></script>
<script src="static/js/nearby_suggestions.js" defer></script>
<script src="/static/js/results_nearby_list.js"></script>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="static/css/nearby.css">
{% endblock %}

{% block content %}
    <div class="header">
        <img src="static/images/logo.png" alt="logo" class="header-img">
        <h1>ParkEasy</h1>
        <div class="user-icon-circle">
            <i class="fas fa-user"></i>
        </div>        
    </div>

    <div class="location">
        <input type="text" id="location_input" class="form-control" placeholder="My location" autocomplete="off">
        
        <ul id="locationDropdown" class="location-dropdown d-none">
            <li id="getLocationOption">
                <i class="bi bi-geo-alt"></i> Get current location
            </li>
        </ul>
    </div>

    <div class="row g-3 justify-content-center time-div">
        <button id="submitBtn" type="button" class="submit-btn" disabled>Look Around</button>
    </div>

    <ul id="parkingList" class="result-list"></ul>

{% endblock %}
