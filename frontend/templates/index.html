<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Search Window </title>

    <link rel="stylesheet" href="static/css/index.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <div class="container">
        <div class="header">
            <img src="static/images/logo.png" alt="logo" class="header-img">
            <h1>ParkEasy</h1>
            <div class="user-icon-circle">
                <i class="fas fa-user"></i>
            </div>
        </div>
        <div class="search">
            <button class="filter-button" data-bs-toggle="modal" data-bs-target="#filterModal">
                <i class="fas fa-sliders-h"></i>
            </button>
            <input id="search" type="text" placeholder="Search Parking Location">
            <ul id="suggestions"></ul>
            <input type="hidden" id="evChargingInput" name="ev_charging" value="false">
            <button type="submit" class="submit-btn" onclick="searchParking()">Search Parking</button>
            <ul id="parkingList" class="result-list"></ul>
        </div>
    </div>
    <!-- Bootstrap Modal -->
    <div class="modal fade" id="filterModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog custom-modal-position">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Filter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label>
                        <input type="checkbox" id="evChargingCheckbox"
                        {% if ev_filter %}checked{% endif %}>
                        EV-Charging vorhanden
                    </label>
                </div>

                <div class="modal-footer">
                    <button class="modal-btn" onclick="applyFilter()">Übernehmen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/result_list.js"></script>
    <script src="/static/js/search_suggestions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
