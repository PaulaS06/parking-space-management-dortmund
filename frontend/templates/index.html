{% extends "layout.html" %}
{% block content %}
    <div id="errorBox" class="alert alert-danger d-none"></div>
    <div class="header">
        <img src="static/images/logo.png" alt="logo" class="header-img">
        <h1>ParkEasy</h1>
        <div class="user-icon-circle">
            <i class="fas fa-user"></i>
        </div>
    </div>
    <div class="search">
        <button class="filter-button" data-bs-toggle="modal" data-bs-target="#filterModal">
            <i class="fas fa-sliders-h"></i>
        </button>
        <div class="search-container">
            <input id="search" type="text" placeholder="Where do you want to go to?">
            <button id="voiceBtn" type="button" class="mic-button" onclick="startSpeech()"><img src="static/images/microphone.png" alt="logo" class="mic-img"></button>
        </div>
        <ul id="suggestions"></ul>
        <div class="row g-3 justify-content-center time-div">
            <div class="col-md-6 time-input">
                <label for="startTime" class="form-label">From</label>
                <input type="time" class="form-control" id="startTime">
            </div>
            <div class="col-md-6 time-input">
                <label for="endTime" class="form-label">To</label>
                <input type="time" class="form-control" id="endTime">
            </div>

        </div>
        <div class="row g-3 justify-content-center time-div">
            <button id="submitBtn" type="submit" class="submit-btn" onclick="searchParking()" disabled>Search Parking</button>
        </div>
        <input type="hidden" id="evChargingInput" name="ev_charging" value="false">

        <ul id="parkingList" class="result-list"></ul>
    </div>
    <!-- Bootstrap Modal -->
    <div class="modal fade" id="filterModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static"
     data-bs-keyboard="false">
        <div class="modal-dialog custom-modal-position">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Filter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label>
                        <input type="checkbox" id="evChargingCheckbox">
                        EV-charging available
                    </label>
                </div>

                <div class="modal-footer">
                    <button class="modal-btn" onclick="applyFilter()" data-bs-dismiss="modal">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <div id="loadingOverlay"
         class="position-fixed top-0 start-0 w-100 h-100 d-none
                bg-white bg-opacity-75
                d-flex align-items-center justify-content-center"
         style="z-index: 1055;">

        <div class="text-center">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="mt-3 fw-medium">Searching for free spots…</div>
        </div>
    </div>
{% endblock %}

</html>
