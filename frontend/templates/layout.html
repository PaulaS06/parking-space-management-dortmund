<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/index.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="pb-5"> <!-- padding-bottom, damit die Navbar unten nicht überlappt -->

    <!-- Hauptinhalt -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav class="fixed-bottom d-flex justify-content-center mb-3">
        <div class="navbar navbar-dark bg-dark shadow rounded-pill px-4 py-2" style="max-width: 600px;">
            <div class="d-flex justify-content-between" style="width: 200px;">
                <a class="navbar-brand mx-auto" href="{{ url_for('home') }}">Search</a>
                <a class="navbar-brand mx-auto" href="{{ url_for('nearby') }}">Nearby</a>
            </div>
        </div>
    </nav>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/scripts.js"></script>
    <script src="/static/js/result_list.js"></script>
    <script src="/static/js/search_suggestions.js"></script>
</body>
</html>
