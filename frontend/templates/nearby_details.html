<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Parkhaus Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="static/css/details.css">
</head>
<body>

<div class="container parking-detail-container">

    <div class="text-start mb-2">
        <button class="btn back-btn" onclick="history.back()">← Back</button>
    </div>

    <h1 id="parkingName"></h1>

    <div class="status-box mb-3">
        <span id="capacityDot" class="dot"></span>
        <span id="capacityText"></span>
    </div>

    <!-- Infos -->
    <div class="card info-card mb-3">
        <div class="card-body">

            <div class="info-row">
                <span class="label">📍 Address</span>
                <span id="parkingAddress"></span>
            </div>

            <div class="info-row">
                <span class="label">⚡ EV-charging</span>
                <span id="evCharging"></span>
            </div>

            <div class="info-row">
                <span class="label">💰 Price</span>
                <span id="priceTotal"></span>
            </div>

        </div>
    </div>

    <!-- Google Maps -->
    <button type="submit" id="mapsLink" class="maps-btn" target="_blank">
        Start route in Maps
    </button>

</div>

<script src="static/js/nearby_details.js"></script>
</body>
</html>
